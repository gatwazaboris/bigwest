services:
  mysql:
    image: mysql:8.4
    container_name: big-west-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: big_west_tours
      MYSQL_USER: bigwest
      MYSQL_PASSWORD: bigwest
    volumes:
      - big_west_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  big_west_mysql_data:
